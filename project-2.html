<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Speed Audit Planner | Abdul Moyeed Arqam</title><meta name="description" content="An interactive WordPress speed audit that scores readiness and ranks fixes by impact and effort."><meta name="theme-color" content="#0a1424"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9A%A1%3C/text%3E%3C/svg%3E"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head><body><div class="prog" id="prog"></div><a class="skip" href="#main">Skip to content</a><header><div class="w"><a class="logo" href="index.html">moyeed<span>.dev</span></a><nav><a href="index.html#projects">All projects</a><a href="index.html#contact">Contact</a></nav></div></header><main id="main" class="w pj"><a class="crumb" href="index.html#projects">← Back to projects</a><h1>Speed Audit Planner</h1><p class="sub">Tick what a site already does. The planner scores it, ranks the remaining fixes by impact against effort, and exports the plan.</p><div class="tool"><div class="card chk"><div id="list"></div></div><div class="card" style="position:sticky;top:76px"><div class="big" id="pct">0%</div><div class="bar"><i id="fill"></i></div><p class="note" id="cnt"></p><h3 style="margin:18px 0 6px;font-size:19px">Fix these first</h3><ol id="top" style="padding-left:20px;color:#cdd8ee"></ol><div class="acts"><button class="btn pri" id="dl" type="button">Download plan</button><button class="btn" id="rs" type="button">Reset</button></div></div></div></main><footer><div class="w"><span>© 2026 Abdul Moyeed Arqam</span><a href="index.html">Home</a></div></footer><script src="script.js"></script><script>var I=[['Take a full backup and use a staging copy before changing anything',2,1],['Run one caching plugin only, with page caching on',10,1],['Compress images and serve WebP or AVIF',10,2],['Preload the main hero image and do not lazy-load it',9,1],['Set width and height on all images to stop layout shifts',7,1],['Lazy-load images that are below the fold',6,1],['Remove plugins and themes you do not use',7,1],['Delay chat, ads and tracking scripts until the first interaction',9,2],['Limit fonts to two families and use font-display: swap',6,1],['Turn on a CDN such as Cloudflare',6,1],['Minify CSS and JavaScript and defer non-critical files',7,2],['Clean database revisions and expired transients',3,1],['Use a current PHP version and fast hosting with server caching',6,2],['Re-test Core Web Vitals after every change',5,1]];
var $=function(i){return document.getElementById(i)},st={};try{st=JSON.parse(localStorage.getItem('audit')||'{}')}catch(e){}
var EF=['','Low effort','Medium effort','High effort'];
function save(){try{localStorage.setItem('audit',JSON.stringify(st))}catch(e){}}
function calc(){var tw=0,dw=0,todo=[];I.forEach(function(x,i){tw+=x[1];if(st[i])dw+=x[1];else todo.push({t:x[0],r:x[1]/x[2],w:x[1]})});todo.sort(function(a,b){return b.r-a.r});
var p=Math.round(dw/tw*100);$('pct').textContent=p+'%';$('fill').style.width=p+'%';$('cnt').textContent=Object.keys(st).filter(function(k){return st[k]}).length+' of '+I.length+' done. Items are weighted by their impact on speed.';
var o=$('top');o.textContent='';todo.slice(0,5).forEach(function(x){var l=document.createElement('li');l.textContent=x.t;l.style.marginBottom='6px';o.appendChild(l)});if(!todo.length){var l=document.createElement('li');l.textContent='Everything is done. Re-test and document the before and after.';o.appendChild(l)}return{p:p,todo:todo}}
var L=$('list');I.forEach(function(x,i){var lb=document.createElement('label'),c=document.createElement('input');c.type='checkbox';c.checked=!!st[i];c.onchange=function(){st[i]=c.checked;save();calc()};var d=document.createElement('div'),t=document.createElement('div');t.textContent=x[0];var m=document.createElement('span');m.className='badge';m.textContent='Impact '+x[1]+'/10 · '+EF[x[2]];m.style.display='inline-block';m.style.marginTop='6px';d.appendChild(t);d.appendChild(m);lb.appendChild(c);lb.appendChild(d);L.appendChild(lb)});
$('dl').onclick=function(){var r=calc(),t=['WordPress speed audit plan','Readiness: '+r.p+'%','','Fix in this order:'];r.todo.forEach(function(x,i){t.push((i+1)+'. '+x.t)});var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t.join('\n')],{type:'text/plain'}));a.download='speed-audit-plan.txt';a.click()};
$('rs').onclick=function(){st={};save();document.querySelectorAll('.chk input').forEach(function(c){c.checked=false});calc()};calc();</script></body></html>
