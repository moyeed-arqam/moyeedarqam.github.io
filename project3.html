<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Speed Auditor</title>
    <style>
        :root { --bg: #050a14; --surface: rgba(15, 25, 45, 0.7); --border: #1e293b; --accent: #00ff88; --text: #fff; --muted: #94a3b8; }
        body { background: radial-gradient(circle at top right, #0a192f 0%, #050a14 100%); color: var(--text); font-family: 'JetBrains Mono', monospace; margin: 0; padding: 40px; min-height: 100vh; }
        .header { display: flex; justify-content: space-between; border-bottom: 1px solid var(--border); padding-bottom: 20px; margin-bottom: 40px; }
        .logo { font-size: 1.5rem; color: var(--accent); font-weight: bold; }
        .back-btn { color: var(--muted); text-decoration: none; border: 1px solid var(--border); padding: 8px 16px; border-radius: 8px; transition: 0.3s; }
        .back-btn:hover { color: var(--accent); border-color: var(--accent); }
        h1 { font-size: 2.5rem; margin-bottom: 10px; }
        .subtitle { color: var(--muted); margin-bottom: 40px; }
        
        .controls-row { display: flex; gap: 15px; margin-bottom: 40px; align-items: stretch; }
        .search-box { display: flex; gap: 10px; flex: 1; }
        input { flex: 1; background: var(--surface); border: 1px solid var(--border); padding: 15px; border-radius: 8px; color: #fff; font-family: inherit; font-size: 1rem; outline: none; transition: 0.3s; }
        input:focus { border-color: var(--accent); box-shadow: 0 0 15px rgba(0,255,136,0.1); }
        
        .device-toggle { display: flex; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
        .device-btn { background: transparent; border: none; color: var(--muted); padding: 0 20px; cursor: pointer; font-family: inherit; font-weight: bold; transition: 0.3s; }
        .device-btn.active { background: var(--accent); color: #000; }
        
        button.audit-btn { background: var(--accent); color: #000; border: none; padding: 15px 30px; font-weight: bold; border-radius: 8px; font-family: inherit; cursor: pointer; transition: 0.3s; }
        button.audit-btn:hover { box-shadow: 0 0 20px rgba(0,255,136,0.3); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .results-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 40px; display: none; }
        .metric-card { background: var(--surface); border: 1px solid var(--border); padding: 25px; border-radius: 12px; text-align: center; backdrop-filter: blur(10px); }
        .metric-title { font-size: 0.8rem; color: var(--muted); text-transform: uppercase; margin-bottom: 10px; }
        .metric-score { font-size: 3rem; font-weight: bold; }
        
        .cwv-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; display: none; }
        .cwv-card { background: var(--surface); border: 1px solid var(--border); padding: 25px; border-radius: 12px; backdrop-filter: blur(10px); }
        .cwv-val { font-size: 2rem; font-weight: bold; margin-top: 10px; }
        .status-text { font-size: 0.8rem; margin-top: 5px; }

        .loading { display: none; text-align: center; padding: 40px; color: var(--accent); font-size: 1.2rem; }
        .loader { border: 4px solid var(--border); border-top: 4px solid var(--accent); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        @media (max-width: 768px) { .controls-row { flex-direction: column; } .results-grid, .cwv-grid { grid-template-columns: 1fr 1fr; } }
    </style>
</head>
<body>
    <div class="header"><div class="logo">PageSpeed_API</div><a href="index.html" class="back-btn">← Back</a></div>
    <h1>Live Website Auditor</h1>
    <p class="subtitle">Fetch real performance data from Google PageSpeed Insights API.</p>
    
    <div class="controls-row">
        <div class="search-box">
            <input type="url" id="urlInput" placeholder="https://example.com" value="https://wordpress.org">
        </div>
        <div class="device-toggle">
            <button class="device-btn active" id="btnMobile" onclick="setDevice('mobile')">Mobile</button>
            <button class="device-btn" id="btnDesktop" onclick="setDevice('desktop')">Desktop</button>
        </div>
        <button class="audit-btn" id="auditBtn" onclick="runAudit()">Run Audit</button>
    </div>

    <div class="loading" id="loading">
        <div class="loader"></div>
        Analyzing site... this may take 10-15 seconds.
    </div>

    <div class="results-grid" id="resultsGrid">
        <div class="metric-card"><div class="metric-title">Performance</div><div class="metric-score" id="scorePerf">-</div></div>
        <div class="metric-card"><div class="metric-title">Accessibility</div><div class="metric-score" id="scoreAcc">-</div></div>
        <div class="metric-card"><div class="metric-title">Best Practices</div><div class="metric-score" id="scoreBest">-</div></div>
        <div class="metric-card"><div class="metric-title">SEO</div><div class="metric-score" id="scoreSeo">-</div></div>
    </div>

    <div class="cwv-grid" id="cwvGrid">
        <div class="cwv-card"><div class="metric-title">LCP</div><div class="cwv-val" id="lcpVal">-</div><div class="status-text" id="lcpStatus"></div></div>
        <div class="cwv-card"><div class="metric-title">CLS</div><div class="cwv-val" id="clsVal">-</div><div class="status-text" id="clsStatus"></div></div>
        <div class="cwv-card"><div class="metric-title">INP (or TBT)</div><div class="cwv-val" id="inpVal">-</div><div class="status-text" id="inpStatus"></div></div>
    </div>

    <script>
        let currentStrategy = 'mobile';

        function setDevice(device) {
            currentStrategy = device;
            document.getElementById('btnMobile').classList.toggle('active', device === 'mobile');
            document.getElementById('btnDesktop').classList.toggle('active', device === 'desktop');
        }

        async function runAudit() {
            const url = document.getElementById('urlInput').value;
            if(!url) return alert('Please enter a URL');
            
            document.getElementById('resultsGrid').style.display = 'none';
            document.getElementById('cwvGrid').style.display = 'none';
            document.getElementById('loading').style.display = 'block';
            document.getElementById('auditBtn').disabled = true;

            try {
                const api = `https://www.googleapis.com/pagespeedonline/v5/runPagespeed?url=${encodeURIComponent(url)}&strategy=${currentStrategy}`;
                const response = await fetch(api);
                const data = await response.json();

                if(data.error) throw new Error(data.error.message);

                const scores = data.lighthouseResult.categories;
                updateScore('scorePerf', scores.performance.score);
                updateScore('scoreAcc', scores.accessibility.score);
                updateScore('scoreBest', scores['best-practices'].score);
                updateScore('scoreSeo', scores.seo.score);

                const audits = data.lighthouseResult.audits;
                
                document.getElementById('lcpVal').innerText = audits['largest-contentful-paint'].displayValue;
                document.getElementById('lcpStatus').innerText = audits['largest-contentful-paint'].score >= 0.9 ? 'Good' : 'Needs Work';
                document.getElementById('lcpStatus').style.color = getColor(audits['largest-contentful-paint'].score);

                document.getElementById('clsVal').innerText = audits['cumulative-layout-shift'].displayValue;
                document.getElementById('clsStatus').innerText = audits['cumulative-layout-shift'].score >= 0.9 ? 'Good' : 'Needs Work';
                document.getElementById('clsStatus').style.color = getColor(audits['cumulative-layout-shift'].score);

                // INP fallback to TBT
                if(audits['interaction-to-next-paint']) {
                    document.getElementById('inpVal').innerText = audits['interaction-to-next-paint'].displayValue;
                    document.getElementById('inpStatus').innerText = audits['interaction-to-next-paint'].score >= 0.9 ? 'Good' : 'Needs Work';
                    document.getElementById('inpStatus').style.color = getColor(audits['interaction-to-next-paint'].score);
                } else {
                    document.getElementById('inpVal').innerText = audits['total-blocking-time'].displayValue;
                    document.getElementById('inpStatus').innerText = 'TBT (Proxy)';
                }

                document.getElementById('resultsGrid').style.display = 'grid';
                document.getElementById('cwvGrid').style.display = 'grid';

            } catch(err) {
                alert('Error: ' + err.message);
            } finally {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('auditBtn').disabled = false;
            }
        }

        function updateScore(id, score) {
            const el = document.getElementById(id);
            el.innerText = Math.round(score * 100);
            el.style.color = getColor(score);
        }

        function getColor(score) {
            if(score >= 0.9) return '#00ff88';
            if(score >= 0.5) return '#ffbd2e';
            return '#ff5f56';
        }
    </script>
</body>
</html>
