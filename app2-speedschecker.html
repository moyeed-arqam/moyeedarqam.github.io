<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WP Speed Analyzer</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: #1e293b; padding: 40px; border-radius: 20px; width: 400px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h1 { margin-bottom: 10px; font-size: 1.5rem; }
        p { color: #94a3b8; font-size: 0.9rem; margin-bottom: 30px; }
        .metric { text-align: left; margin-bottom: 20px; }
        .metric-header { display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 0.9rem; }
        .bar-bg { background: #334155; height: 10px; border-radius: 5px; overflow: hidden; }
        .bar-fill { height: 100%; width: 0%; border-radius: 5px; transition: width 1s ease-in-out; }
        .lcp { background: #10b981; }
        .inp { background: #f59e0b; }
        .cls { background: #ef4444; }
        button { background: #3b82f6; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-size: 1rem; cursor: pointer; margin-top: 20px; width: 100%; transition: 0.3s; }
        button:hover { background: #2563eb; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .score { font-size: 3rem; font-weight: bold; margin-top: 20px; color: #10b981; opacity: 0; transition: opacity 0.5s; }
    </style>
</head>
<body>
    <div class="container">
        <h1>WordPress Speed Analyzer</h1>
        <p>Simulating Core Web Vitals audit...</p>
        
        <div class="metric">
            <div class="metric-header"><span>LCP (Largest Contentful Paint)</span><span id="lcp-val">0.0s</span></div>
            <div class="bar-bg"><div class="bar-fill lcp" id="lcp-bar"></div></div>
        </div>
        <div class="metric">
            <div class="metric-header"><span>INP (Interaction to Next Paint)</span><span id="inp-val">0ms</span></div>
            <div class="bar-bg"><div class="bar-fill inp" id="inp-bar"></div></div>
        </div>
        <div class="metric">
            <div class="metric-header"><span>CLS (Cumulative Layout Shift)</span><span id="cls-val">0.00</span></div>
            <div class="bar-bg"><div class="bar-fill cls" id="cls-bar"></div></div>
        </div>

        <button id="run-btn" onclick="runTest()">Run Speed Test</button>
        <div class="score" id="final-score">98</div>
    </div>

    <script>
        function runTest() {
            const btn = document.getElementById('run-btn');
            btn.disabled = true;
            btn.innerText = 'Analyzing...';
            document.getElementById('final-score').style.opacity = 0;
            
            // Simulate LCP
            setTimeout(() => {
                document.getElementById('lcp-bar').style.width = '85%';
                document.getElementById('lcp-val').innerText = '1.8s';
                document.getElementById('lcp-val').style.color = '#10b981';
            }, 500);

            // Simulate INP
            setTimeout(() => {
                document.getElementById('inp-bar').style.width = '40%';
                document.getElementById('inp-val').innerText = '120ms';
                document.getElementById('inp-val').style.color = '#f59e0b';
            }, 1500);

            // Simulate CLS
            setTimeout(() => {
                document.getElementById('cls-bar').style.width = '15%';
                document.getElementById('cls-val').innerText = '0.05';
                document.getElementById('cls-val').style.color = '#10b981';
            }, 2500);

            // Finish
            setTimeout(() => {
                btn.disabled = false;
                btn.innerText = 'Run Speed Test';
                document.getElementById('final-score').style.opacity = 1;
            }, 3500);
        }
    </script>
</body>
</html>
