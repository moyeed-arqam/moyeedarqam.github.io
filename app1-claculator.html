<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neumorphic Calculator</title>
    <style>
        body { background: #e0e5ec; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: sans-serif; }
        .calculator { background: #e0e5ec; padding: 30px; border-radius: 20px; box-shadow: 9px 9px 16px #a3b1c6, -9px -9px 16px #ffffff; }
        .display { width: 100%; height: 60px; background: #e0e5ec; border: none; border-radius: 10px; box-shadow: inset 6px 6px 10px #a3b1c6, inset -6px -6px 10px #ffffff; font-size: 2rem; text-align: right; padding: 10px; margin-bottom: 20px; box-sizing: border-box; color: #4a5568; }
        .buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; }
        button { width: 60px; height: 60px; border-radius: 50%; border: none; background: #e0e5ec; box-shadow: 6px 6px 10px #a3b1c6, -6px -6px 10px #ffffff; font-size: 1.2rem; color: #4a5568; cursor: pointer; transition: 0.2s; }
        button:active { box-shadow: inset 6px 6px 10px #a3b1c6, inset -6px -6px 10px #ffffff; }
        .operator { color: #5c33ff; font-weight: bold; }
        .equal { background: #5c33ff; color: white; box-shadow: 6px 6px 10px #a3b1c6, -6px -6px 10px #ffffff; }
    </style>
</head>
<body>
    <div class="calculator">
        <input type="text" class="display" id="display" disabled>
        <div class="buttons">
            <button onclick="clearDisplay()" class="operator">C</button>
            <button onclick="appendNumber('/')" class="operator">/</button>
            <button onclick="appendNumber('*')" class="operator">*</button>
            <button onclick="deleteNumber()" class="operator">DEL</button>
            <button onclick="appendNumber('7')">7</button>
            <button onclick="appendNumber('8')">8</button>
            <button onclick="appendNumber('9')">9</button>
            <button onclick="appendNumber('-')" class="operator">-</button>
            <button onclick="appendNumber('4')">4</button>
            <button onclick="appendNumber('5')">5</button>
            <button onclick="appendNumber('6')">6</button>
            <button onclick="appendNumber('+')" class="operator">+</button>
            <button onclick="appendNumber('1')">1</button>
            <button onclick="appendNumber('2')">2</button>
            <button onclick="appendNumber('3')">3</button>
            <button onclick="calculate()" class="equal" style="grid-row: span 2;">=</button>
            <button onclick="appendNumber('0')" style="grid-column: span 2;">0</button>
            <button onclick="appendNumber('.')">.</button>
        </div>
    </div>
    <script>
        const display = document.getElementById('display');
        function appendNumber(num) { display.value += num; }
        function clearDisplay() { display.value = ''; }
        function deleteNumber() { display.value = display.value.toString().slice(0, -1); }
        function calculate() { try { display.value = eval(display.value); } catch { display.value = 'Error'; } }
    </script>
</body>
</html>
